[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-cfs"
version = "0.1.0"
description = "F Prime dictionary conversion and runner tooling for the cFS GroundSystem GDS"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "fprime-gds>=4.2.1,<5",
]

[project.scripts]
fprime-cfs = "fprime_cfs.__main__:main"
fprime-cfs-config = "fprime_cfs.generate:main"
fprime-cfs-comm = "fprime_cfs.comm:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=6"]
