# CI for the fprime_cfs library. Both jobs check out fprime_cfs_reference and overlay
# this revision of fprime_cfs into it via fprime-actions/external-repository-setup:
#   1. Build and run the unit tests for all fprime_cfs components
#   2. Build the fprime_cfs_reference external project and run its GDS integration tests

name: "CI"

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup fprime_cfs_reference with fprime_cfs overlay"
        uses: JPL-Devin/fprime-actions/external-repository-setup@devin/1784743217-overlay-location
        with:
          target_repository: fprime-community/fprime_cfs_reference
          fprime_location: ./libs/fprime
          overlay_location: ./libs/fprime_cfs
      - name: "Build and Run Unit Tests"
        uses: nasa/fprime-actions/run-unit-tests@devel
        with:
          working-directory: libs/fprime_cfs
          generate-args: "-DFPRIME_ENABLE_FRAMEWORK_UTS=OFF"

  reference-build-and-test:
    name: "Reference Build and Integration Tests"
    runs-on: ubuntu-22.04
    steps:
      - name: "Make Space"
        uses: nasa/fprime-actions/make-space@devel
      - name: "Setup fprime_cfs_reference with fprime_cfs overlay"
        uses: JPL-Devin/fprime-actions/external-repository-setup@devin/1784743217-overlay-location
        with:
          target_repository: fprime-community/fprime_cfs_reference
          fprime_location: ./libs/fprime
          overlay_location: ./libs/fprime_cfs
      - name: "Build"
        run: |
          make SIMULATION=native prep
          make
          make install
      - name: "Run Integration Tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          gds-working-directory: build-artifacts/exe/cpu1
          test-working-directory: test/int
          binary: ./core-cpu1
          binary-args: ""
          gds-args: >-
            --ip-client --ip-port 15010
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
          pytest-args: >-
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
      - name: "Archive logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfs-reference-logs
          path: build-artifacts/exe/cpu1/gds-logs
          retention-days: 5
